<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Casey's Toolbox</title>
<style>
:root{--bg:#f1f3f6;--panel:#fff;--ink:#18202b;--muted:#5d6878;--line:#d8dee6;--accent:#d9480f;--accent-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121519;--panel:#1b2027;--ink:#e6eaf0;--muted:#97a1ae;--line:#2c333d;--accent:#f76707;--accent-ink:#1b0c02}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{margin:0;font-size:20px}
header .sub{color:var(--muted);font-size:13px}
header .spacer{flex:1}
.btn{font:inherit;font-weight:600;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--accent)}
main{flex:1;min-height:0}
#home{max-width:1100px;margin:0 auto;padding:28px 20px}
#home p.lead{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.tool{display:flex;flex-direction:column;gap:8px;text-align:left;padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:inherit;transition:transform .12s,border-color .12s}
.tool:hover{border-color:var(--accent);transform:translateY(-2px)}
.tool .icon{font-size:30px;line-height:1}
.tool b{font-size:16px}
.tool span{color:var(--muted);font-size:13px}
#view{display:none;height:100%}
#view iframe{width:100%;height:100%;border:0;background:#fff}
body.viewing #home{display:none}
body.viewing #view{display:block}
#backBtn,#popBtn{display:none}
body.viewing #backBtn,body.viewing #popBtn{display:inline-block}
@media (max-width:600px){header{padding:10px 12px;gap:8px;flex-wrap:wrap}header h1{font-size:17px}#popBtn{font-size:12px;padding:6px 9px}#home{padding:18px 16px}}
#view{-webkit-overflow-scrolling:touch}
.note{margin-top:24px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header>
  <button class="btn" id="backBtn" type="button">← Toolbox</button>
  <div>
    <h1 id="title">🧰 Casey's Toolbox</h1>
    <div class="sub" id="subtitle">Pick a tool to get started</div>
  </div>
  <div class="spacer"></div>
  <a class="btn" id="popBtn" target="_blank" rel="noopener">Open in new tab ↗</a>
</header>
<main>
  <section id="home">
    <p class="lead">All tools run locally in your browser — files never leave your computer.</p>
    <div class="grid" id="grid"></div>
    <p class="note">All tools are built into this one file — no other files needed.</p>
  </section>
  <section id="view"><iframe id="frame" title="Tool" allow="autoplay; clipboard-write"></iframe></section>
</main>
<script>
const BUNDLE = {"index.html": "<!doctype html>\n<html lang=\"en\">\n<head>\n<script>\n/* Safari/iPhone can't decode audio straight out of .MOV/.MP4 video files.\n   1) pull the audio track into a clean audio-only .m4a and decode that;\n   2) else try the original file; 3) else decode the AAC frames with WebCodecs. */\n(function(){\n  var RATES=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];\n  function u32(d,o){return d.getUint32(o)}\n  function typ(u,o){return String.fromCharCode(u[o],u[o+1],u[o+2],u[o+3])}\n  function boxes(u,d,s,e){\n    var out=[],o=s;\n    while(o+8<=e){\n      var sz=u32(d,o),t=typ(u,o+4),h=8;\n      if(sz===1){sz=u32(d,o+8)*4294967296+u32(d,o+12);h=16}else if(sz===0)sz=e-o;\n      if(sz<h||o+sz>e)break;\n      out.push({t:t,s:o,h:h,e:o+sz});o+=sz;\n    }\n    return out;\n  }\n  function find(l,t){for(var i=0;i<l.length;i++)if(l[i].t===t)return l[i]}\n  function kids(u,d,b){return boxes(u,d,b.s+b.h,b.e)}\n  function isMP4(buf){\n    if(!buf||buf.byteLength<12)return false;\n    var t=typ(new Uint8Array(buf,0,8),4);\n    return t==='ftyp'||t==='moov'||t==='wide'||t==='mdat'||t==='free'||t==='skip';\n  }\n  function cat(parts){var n=0,i;for(i=0;i<parts.length;i++)n+=parts[i].length;var r=new Uint8Array(n),o=0;for(i=0;i<parts.length;i++){r.set(parts[i],o);o+=parts[i].length}return r}\n  function box(t,body){var r=new Uint8Array(8+body.length),d=new DataView(r.buffer);d.setUint32(0,r.length);for(var i=0;i<4;i++)r[4+i]=t.charCodeAt(i);r.set(body,8);return r}\n  function be(arr){var r=new Uint8Array(arr.length*4),d=new DataView(r.buffer);for(var i=0;i<arr.length;i++)d.setUint32(i*4,arr[i]);return r}\n\n  // read an MPEG-4 descriptor length\n  function dlen(u,o){var n=0,i=0,b;do{b=u[o+i];n=(n<<7)|(b&127);i++}while(b&128&&i<4);return[n,i]}\n  function parseEsds(u,s,e){ // s = start of esds payload (after box header)\n    var o=s+4;\n    while(o<e){\n      var tag=u[o],L=dlen(u,o+1),body=o+1+L[1];\n      if(tag===3){var fl=u[body+2];o=body+3;if(fl&128)o+=2;if(fl&64)o+=1+u[o];if(fl&32)o+=2;continue}\n      if(tag===4){var ot=u[body];o=body+13;var t5=u[o];if(t5===5){var L5=dlen(u,o+1),b5=o+1+L5[1];return{ot:ot,asc:u.slice(b5,b5+L5[0])}}return{ot:ot,asc:null}}\n      o=body+L[0];\n    }\n    return null;\n  }\n\n  function extract(buf){\n    var u=new Uint8Array(buf),d=new DataView(buf);\n    var top=boxes(u,d,0,u.length),moov=find(top,'moov');if(!moov)return null;\n    var mk=kids(u,d,moov),mvhd=find(mk,'mvhd'),trak=null,i;\n    for(i=0;i<mk.length;i++){\n      if(mk[i].t!=='trak')continue;\n      var md=find(kids(u,d,mk[i]),'mdia');if(!md)continue;\n      var hd=find(kids(u,d,md),'hdlr');\n      if(hd&&typ(u,hd.s+hd.h+8)==='soun'){trak=mk[i];break}\n    }\n    if(!trak||!mvhd)return null;\n    var mdia=find(kids(u,d,trak),'mdia'),minf=find(kids(u,d,mdia),'minf'),stbl=find(kids(u,d,minf),'stbl');\n    var sk=kids(u,d,stbl),stsd=find(sk,'stsd'),stsz=find(sk,'stsz'),stsc=find(sk,'stsc'),stco=find(sk,'stco'),co64=find(sk,'co64');\n    if(!stsd||!stsz||!stsc||!(stco||co64))return null;\n    var p=stsz.s+stsz.h,fixed=u32(d,p+4),n=u32(d,p+8),sizes=new Array(n);\n    for(i=0;i<n;i++)sizes[i]=fixed||u32(d,p+12+i*4);\n    var co=co64||stco,cp=co.s+co.h,nc=u32(d,cp+4),offs=new Array(nc);\n    for(i=0;i<nc;i++)offs[i]=co64?u32(d,cp+8+i*8)*4294967296+u32(d,cp+12+i*8):u32(d,cp+8+i*4);\n    var sp=stsc.s+stsc.h,ne=u32(d,sp+4),ent=[];\n    for(i=0;i<ne;i++)ent.push([u32(d,sp+8+i*12),u32(d,sp+12+i*12)]);\n    var frames=[],si=0,total=0;\n    for(var c=0;c<nc&&si<n;c++){\n      var spc=0;for(var e=0;e<ent.length;e++)if(ent[e][0]<=c+1)spc=ent[e][1];\n      var o=offs[c];\n      for(var k=0;k<spc&&si<n;k++,si++){\n        var sz=sizes[si];if(o+sz>u.length)break;\n        frames.push(u.subarray(o,o+sz));o+=sz;total+=sz;\n      }\n    }\n    if(!total)return null;\n    // sample entry: codec, channels, rate, esds (may be nested inside a QuickTime 'wave' box)\n    var se=stsd.s+stsd.h+8,codec=typ(u,se+4),ch=d.getUint16(se+24),rate=u32(d,se+32)>>>16,esds=null,info=null;\n    for(i=se+8;i<stsd.e-8;i++){if(u[i]===101&&u[i+1]===115&&u[i+2]===100&&u[i+3]===115){var bs=u32(d,i-4);if(bs>=12&&i-4+bs<=stsd.e){esds=u.subarray(i-4,i-4+bs);info=parseEsds(u,i+4,i-4+bs)}break}}\n    if(info&&info.asc&&info.asc.length>=2){\n      var a=info.asc,fi=((a[0]&7)<<1)|(a[1]>>7),cc=(a[1]>>3)&15;\n      if(RATES[fi])rate=RATES[fi];if(cc>0&&cc<8)ch=cc===7?8:cc;\n      info.aot=a[0]>>3;\n    }\n    return{u:u,d:d,mvhd:mvhd,trak:trak,mdia:mdia,minf:minf,stbl:stbl,frames:frames,total:total,n:frames.length,codec:codec,ch:ch||2,rate:rate||44100,esds:esds,info:info};\n  }\n\n  function toM4A(x){\n    var u=x.u,d=x.d;\n    function raw(b){return u.subarray(b.s,b.e)}\n    function rebuild(b,fn){var ch=kids(u,d,b),body=[];for(var j=0;j<ch.length;j++){var r=fn(ch[j]);if(r)body.push(r)}return box(b.t,cat(body))}\n    var stsdNew=null;\n    if(x.codec==='mp4a'&&x.esds){ // rewrite the QuickTime sound description as a plain ISO one\n      var ent=new Uint8Array(28),ed=new DataView(ent.buffer);\n      ed.setUint16(6,1);ed.setUint16(16,Math.min(x.ch,2));ed.setUint16(18,16);ed.setUint32(24,(x.rate<65536?x.rate:0)*65536);\n      stsdNew=box('stsd',cat([new Uint8Array([0,0,0,0,0,0,0,1]),box('mp4a',cat([ent,x.esds]))]));\n    }\n    function makeMoov(off){\n      var body=[];\n      kids(u,d,x.stbl).forEach(function(b){\n        if(b.t==='stco'||b.t==='co64'||b.t==='stss'||b.t==='sdtp'||b.t==='stsc')return;\n        body.push(b.t==='stsd'&&stsdNew?stsdNew:raw(b));\n        if(b.t==='stsz'){body.push(box('stsc',be([0,1,1,x.n,1])));body.push(box('stco',be([0,1,off])))}\n      });\n      var nStbl=box('stbl',cat(body));\n      var nMinf=rebuild(x.minf,function(b){return b.t==='stbl'?nStbl:raw(b)});\n      var nMdia=rebuild(x.mdia,function(b){return b.t==='minf'?nMinf:raw(b)});\n      var nTrak=rebuild(x.trak,function(b){return b.t==='mdia'?nMdia:(b.t==='tref'?null:raw(b))});\n      return box('moov',cat([raw(x.mvhd),nTrak]));\n    }\n    var ftyp=box('ftyp',new Uint8Array([77,52,65,32,0,0,0,0,77,52,65,32,109,112,52,50,105,115,111,109]));\n    var moovLen=makeMoov(0).length,newMoov=makeMoov(ftyp.length+moovLen+8);\n    var mh=new Uint8Array(8);new DataView(mh.buffer).setUint32(0,x.total+8);mh.set([109,100,97,116],4);\n    return cat([ftyp,newMoov,mh].concat(x.frames)).buffer;\n  }\n\n  function resample(chans,from,to){\n    if(from===to)return chans;\n    var r=from/to,L=Math.floor(chans[0].length/r);\n    return chans.map(function(s){var o=new Float32Array(L),N=s.length;for(var k=0;k<L;k++){var p=k*r,i=Math.floor(p),f=p-i,b=i+1<N?s[i+1]:s[i];o[k]=s[i]+(b-s[i])*f}return o});\n  }\n  async function webCodecs(ctx,x){\n    if(!window.AudioDecoder||x.codec!=='mp4a')throw new Error('no webcodecs');\n    var aot=(x.info&&(x.info.aot===5||x.info.aot===29))?x.info.aot:2;\n    var cfg={codec:'mp4a.40.'+aot,sampleRate:x.rate,numberOfChannels:x.ch};\n    if(x.info&&x.info.asc)cfg.description=x.info.asc;\n    var sup=await AudioDecoder.isConfigSupported(cfg);if(!sup.supported)throw new Error('aac unsupported');\n    var outs=[],sr=0,nch=0,err=null;\n    var dec=new AudioDecoder({output:function(ad){\n      sr=ad.sampleRate;nch=ad.numberOfChannels;var pl=[];\n      for(var c=0;c<nch;c++){var a=new Float32Array(ad.numberOfFrames);ad.copyTo(a,{planeIndex:c,format:'f32-planar'});pl.push(a)}\n      outs.push(pl);ad.close();\n    },error:function(e){err=e}});\n    dec.configure(cfg);\n    var step=1024/x.rate*1e6;\n    for(var i=0;i<x.frames.length;i++){\n      dec.decode(new EncodedAudioChunk({type:'key',timestamp:Math.round(i*step),data:x.frames[i]}));\n      if(dec.decodeQueueSize>200)await new Promise(function(r){setTimeout(r,0)});\n    }\n    await dec.flush();dec.close();\n    if(err||!outs.length)throw err||new Error('nothing decoded');\n    var len=0;outs.forEach(function(p){len+=p[0].length});\n    var chans=[];for(var c=0;c<nch;c++){var a=new Float32Array(len),o=0;outs.forEach(function(p){a.set(p[c],o);o+=p[c].length});chans.push(a)}\n    var rate=ctx.sampleRate||sr;chans=resample(chans,sr,rate);\n    var ab=ctx.createBuffer(nch,chans[0].length,rate);\n    for(c=0;c<nch;c++)ab.getChannelData(c).set(chans[c]);\n    return ab;\n  }\n\n  function patch(C){\n    if(!C||!C.prototype||!C.prototype.decodeAudioData||C.prototype.decodeAudioData.__m4a)return;\n    var orig=C.prototype.decodeAudioData;\n    function call(ctx,b){return new Promise(function(res,rej){try{var pr=orig.call(ctx,b,res,rej);if(pr&&pr.then)pr.then(res,rej)}catch(e){rej(e)}})}\n    var f=function(buf,ok,err){\n      var ctx=this,x=null,m=null,mp4=isMP4(buf);\n      if(mp4){try{x=extract(buf)}catch(e){x=null}}\n      if(x){try{m=toM4A(x)}catch(e){m=null}}\n      var pr;\n      if(m){pr=call(ctx,m).catch(function(){return webCodecs(ctx,x)}).catch(function(){return call(ctx,buf)})}\n      else pr=call(ctx,buf);\n      pr.then(function(a){ok&&ok(a)},function(e){err&&err(e)});\n      return pr;\n    };\n    f.__m4a=1;C.prototype.decodeAudioData=f;\n  }\n  [window.BaseAudioContext,window.AudioContext,window.webkitAudioContext,window.OfflineAudioContext,window.webkitOfflineAudioContext].forEach(patch);\n  window.__m4a={extract:extract,toM4A:toM4A};\n})();\n<\/script>\n\n\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>Video Audio Mixer<\/title>\n<style>\n:root{--bg:#14161a;--panel:#1e2128;--line:#2e333d;--text:#e8eaee;--muted:#9aa1ad;--accent:#3b82f6;--accent2:#22c55e;--warn:#f59e0b}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}\nheader{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}\nheader h1{font-size:17px;margin:0}\nheader span{color:var(--muted);font-size:12px}\nmain{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px;max-width:1300px;margin:auto}\n@media(max-width:900px){main{grid-template-columns:1fr}}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}\n.panel h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}\nvideo{width:100%;max-height:60vh;background:#000;border-radius:8px;display:block}\n.drop{border:2px dashed var(--line);border-radius:8px;padding:14px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:10px;transition:.15s}\n.drop:hover,.drop.over{border-color:var(--accent);color:var(--text)}\n.drop b{color:var(--text);display:block;margin-bottom:2px;word-break:break-all}\ninput[type=file]{display:none}\nlabel.row{display:block;margin:10px 0 4px;color:var(--muted);font-size:12px}\n.val{float:right;color:var(--text);font-variant-numeric:tabular-nums}\ninput[type=range]{width:100%;accent-color:var(--accent)}\n.check{display:flex;align-items:center;gap:8px;margin:10px 0}\nbutton{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:9px 14px;font-weight:600;cursor:pointer;font-size:13px}\nbutton.alt{background:#343a46}\nbutton.go{background:var(--accent2)}\nbutton:disabled{opacity:.4;cursor:not-allowed}\n.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}\n.time{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted)}\n.timeline{position:relative;height:70px;background:#101216;border:1px solid var(--line);border-radius:8px;margin-top:14px;overflow:hidden;cursor:pointer}\n.track{position:absolute;left:0;right:0;height:28px}\n.track.v{top:6px}.track.a{top:38px}\n.clip{position:absolute;top:0;bottom:0;border-radius:4px;font-size:11px;padding:6px 8px;white-space:nowrap;overflow:hidden}\n.clip.v{background:#1d3a6e;border:1px solid var(--accent)}\n.clip.a{background:#1d4d33;border:1px solid var(--accent2);cursor:grab}\n.clip.a canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.55}\n.playhead{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}\n.status{margin-top:10px;font-size:12px;color:var(--muted);min-height:18px}\n.status.warn{color:var(--warn)}\nprogress{width:100%;margin-top:8px;display:none}\na.dl{display:none;margin-top:10px;color:var(--accent2);font-weight:600}\n.hint{font-size:12px;color:var(--muted);margin-top:6px}\n<\/style>\n<\/head>\n<body>\n<header><h1>Video Audio Mixer<\/h1><span>Everything runs locally in your browser \u2014 files never leave your computer.<\/span><\/header>\n<main>\n  <section class=\"panel\">\n    <video id=\"vid\" playsinline webkit-playsinline preload=\"auto\"><\/video>\n    <div class=\"controls\">\n      <button id=\"play\" disabled>\u25b6 Play<\/button>\n      <button id=\"stop\" class=\"alt\" disabled>\u25a0 Stop<\/button>\n      <span class=\"time\" id=\"time\">0:00.0 / 0:00.0<\/span>\n    <\/div>\n    <div class=\"timeline\" id=\"timeline\">\n      <div class=\"track v\"><div class=\"clip v\" id=\"vclip\" style=\"display:none\">Video<\/div><\/div>\n      <div class=\"track a\"><div class=\"clip a\" id=\"aclip\" style=\"display:none\"><canvas id=\"wave\"><\/canvas><span id=\"alabel\" style=\"position:relative\">Audio<\/span><\/div><\/div>\n      <div class=\"playhead\" id=\"playhead\"><\/div>\n    <\/div>\n    <div class=\"hint\">Click the timeline to seek. Drag the green audio clip to move where it starts.<\/div>\n  <\/section>\n\n  <aside class=\"panel\">\n    <h2>1 \u00b7 Media<\/h2>\n    <div class=\"drop\" id=\"vdrop\"><b id=\"vname\">Choose video file<\/b>MP4, WebM, MOV\u2026<\/div>\n    <input type=\"file\" id=\"vfile\" accept=\"video/*\">\n    <div class=\"drop\" id=\"adrop\"><b id=\"aname\">Choose audio file<\/b>MP3, WAV, M4A, OGG\u2026<\/div>\n    <input type=\"file\" id=\"afile\" accept=\"audio/*\">\n\n    <h2 style=\"margin-top:16px\">2 \u00b7 Edit audio<\/h2>\n    <label class=\"row\">Starts at (in video) <span class=\"val\" id=\"offV\">0.0s<\/span><\/label>\n    <input type=\"range\" id=\"offset\" min=\"0\" max=\"0\" step=\"0.1\" value=\"0\">\n    <label class=\"row\">Trim start of audio <span class=\"val\" id=\"tsV\">0.0s<\/span><\/label>\n    <input type=\"range\" id=\"trimS\" min=\"0\" max=\"0\" step=\"0.1\" value=\"0\">\n    <label class=\"row\">Trim end of audio <span class=\"val\" id=\"teV\">0.0s<\/span><\/label>\n    <input type=\"range\" id=\"trimE\" min=\"0\" max=\"0\" step=\"0.1\" value=\"0\">\n    <label class=\"row\">Added audio volume <span class=\"val\" id=\"avV\">100%<\/span><\/label>\n    <input type=\"range\" id=\"avol\" min=\"0\" max=\"200\" value=\"100\">\n    <label class=\"row\">Fade in / out <span class=\"val\" id=\"fdV\">0.0s<\/span><\/label>\n    <input type=\"range\" id=\"fade\" min=\"0\" max=\"10\" step=\"0.1\" value=\"0\">\n    <label class=\"row\">Original video volume <span class=\"val\" id=\"vvV\">100%<\/span><\/label>\n    <input type=\"range\" id=\"vvol\" min=\"0\" max=\"200\" value=\"100\">\n    <div class=\"check\"><input type=\"checkbox\" id=\"loop\"><label for=\"loop\">Loop audio to fill video<\/label><\/div>\n\n    <h2 style=\"margin-top:16px\">3 \u00b7 Export<\/h2>\n    <button class=\"go\" id=\"export\" disabled style=\"width:100%\">Export video<\/button>\n    <progress id=\"prog\" max=\"100\" value=\"0\"><\/progress>\n    <a class=\"dl\" id=\"dl\">\u2b07 Download result<\/a>\n    <div class=\"status\" id=\"status\">Load a video to begin.<\/div>\n    <div class=\"hint\">Export records in real time (a 2-minute video takes ~2 minutes). Output is MP4 or WebM depending on your browser (MP4 on iPhone). Keep this tab visible while exporting.<\/div>\n  <\/aside>\n<\/main>\n\n<script>\nconst $=id=>document.getElementById(id);\nconst vid=$('vid');\nlet ctx, vidSrcNode, vidGain, audioBuf=null, mixDest, activeSrc=null, aGainNode=null;\nlet playing=false, exporting=false, raf;\nconst st={offset:0,trimS:0,trimE:0,avol:1,vvol:1,fade:0,loop:false};\n\nfunction fmt(t){t=Math.max(0,t||0);const m=Math.floor(t/60),s=(t%60).toFixed(1).padStart(4,'0');return m+':'+s}\nfunction status(msg,warn){const s=$('status');s.textContent=msg;s.className='status'+(warn?' warn':'')}\n\nfunction ensureCtx(){\n  if(ctx) return;\n  ctx=new (window.AudioContext||window.webkitAudioContext)();\n  vidSrcNode=ctx.createMediaElementSource(vid);\n  vidGain=ctx.createGain();\n  mixDest=ctx.createMediaStreamDestination();\n  vidSrcNode.connect(vidGain);\n  vidGain.connect(ctx.destination);\n  vidGain.connect(mixDest);\n  vidGain.gain.value=st.vvol;\n}\n\n// ---- file loading\nfunction wireDrop(drop,input,handler){\n  drop.onclick=()=>input.click();\n  input.onchange=()=>input.files[0]&&handler(input.files[0]);\n  drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};\n  drop.ondragleave=()=>drop.classList.remove('over');\n  drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');e.dataTransfer.files[0]&&handler(e.dataTransfer.files[0])};\n}\nwireDrop($('vdrop'),$('vfile'),f=>{\n  stopAll();\n  vid.src=URL.createObjectURL(f);vid.load();\n  $('vname').textContent=f.name;\n  vid.onloadedmetadata=()=>{\n    $('offset').max=vid.duration.toFixed(1);\n    $('vclip').style.display='block';$('vclip').style.left='0';$('vclip').style.width='100%';\n    $('play').disabled=$('stop').disabled=false;\n    $('export').disabled=false;\n    status('Video loaded ('+fmt(vid.duration)+'). Add an audio file.');\n    layout();updateTime();\n  };\n});\nwireDrop($('adrop'),$('afile'),async f=>{\n  ensureCtx();stopAll();\n  status('Decoding audio\u2026');\n  try{\n    audioBuf=await ctx.decodeAudioData(await f.arrayBuffer());\n  }catch(e){status('Could not decode that audio file.',true);return}\n  $('aname').textContent=f.name;\n  const d=audioBuf.duration;\n  $('trimS').max=$('trimE').max=d.toFixed(1);\n  $('trimS').value=0;$('trimE').value=d.toFixed(1);\n  st.trimS=0;st.trimE=d;\n  $('aclip').style.display='block';\n  drawWave();syncLabels();layout();\n  status('Audio loaded ('+fmt(d)+'). Adjust and press Play to preview.');\n});\n\n// ---- controls\nfunction syncLabels(){\n  $('offV').textContent=st.offset.toFixed(1)+'s';\n  $('tsV').textContent=st.trimS.toFixed(1)+'s';\n  $('teV').textContent=st.trimE.toFixed(1)+'s';\n  $('avV').textContent=Math.round(st.avol*100)+'%';\n  $('vvV').textContent=Math.round(st.vvol*100)+'%';\n  $('fdV').textContent=st.fade.toFixed(1)+'s';\n}\nfunction onEdit(){\n  st.offset=+$('offset').value;\n  st.trimS=+$('trimS').value; st.trimE=+$('trimE').value;\n  if(st.trimE<=st.trimS+0.1){st.trimE=Math.min(+$('trimE').max,st.trimS+0.1);$('trimE').value=st.trimE}\n  st.avol=$('avol').value/100; st.vvol=$('vvol').value/100;\n  st.fade=+$('fade').value; st.loop=$('loop').checked;\n  if(vidGain) vidGain.gain.value=st.vvol;\n  syncLabels();layout();\n  if(playing){restartAudioAt(vid.currentTime)}\n}\n['offset','trimS','trimE','avol','vvol','fade'].forEach(id=>$(id).oninput=onEdit);\n$('loop').onchange=onEdit;\n\n// ---- timeline\nfunction clipLen(){return st.trimE-st.trimS}\nfunction layout(){\n  if(!vid.duration||!audioBuf) return;\n  const D=vid.duration,a=$('aclip');\n  let len=st.loop?D-st.offset:clipLen();\n  a.style.left=(st.offset/D*100)+'%';\n  a.style.width=(Math.min(len,D-st.offset)/D*100)+'%';\n  $('alabel').textContent=(st.loop?'Audio (looped) ':'Audio ')+fmt(st.trimS)+'\u2013'+fmt(st.trimE);\n}\nfunction drawWave(){\n  const c=$('wave');c.width=600;c.height=56;const g=c.getContext('2d');\n  const data=audioBuf.getChannelData(0),step=Math.ceil(data.length/c.width);\n  g.fillStyle='#4ade80';\n  for(let x=0;x<c.width;x++){let m=0;for(let i=0;i<step;i+=8){const v=Math.abs(data[x*step+i]||0);if(v>m)m=v}\n    const h=m*c.height;g.fillRect(x,(c.height-h)/2,1,Math.max(1,h))}\n}\n$('timeline').onclick=e=>{\n  if(dragging||!vid.duration||exporting) return;\n  const r=$('timeline').getBoundingClientRect();\n  vid.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*vid.duration;\n  if(playing) restartAudioAt(vid.currentTime);\n  updateTime();\n};\nlet dragging=false;\n$('aclip').onpointerdown=e=>{\n  if(exporting) return;\n  e.stopPropagation();const r=$('timeline').getBoundingClientRect();\n  const start=e.clientX,o0=st.offset;dragging=false;\n  const mv=ev=>{dragging=true;let o=o0+(ev.clientX-start)/r.width*vid.duration;\n    o=Math.max(0,Math.min(vid.duration,o));$('offset').value=o.toFixed(1);onEdit()};\n  const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);setTimeout(()=>dragging=false,0)};\n  addEventListener('pointermove',mv);addEventListener('pointerup',up);\n};\n\n// ---- audio scheduling\nfunction stopAudio(){if(activeSrc){try{activeSrc.stop()}catch(e){}activeSrc.disconnect();activeSrc=null}}\nfunction restartAudioAt(t){\n  stopAudio();\n  if(!audioBuf) return;\n  const len=clipLen(), D=vid.duration;\n  const endInVideo=st.loop?D:st.offset+len;\n  if(t>=endInVideo) return;\n  const src=ctx.createBufferSource();src.buffer=audioBuf;\n  const g=ctx.createGain();\n  src.connect(g);g.connect(ctx.destination);g.connect(mixDest);\n  let when=ctx.currentTime, into=0;\n  if(t<st.offset) when+=st.offset-t; else into=t-st.offset;\n  const totalDur=endInVideo-st.offset;\n  // gain envelope with fades\n  const base=st.avol,f=Math.min(st.fade,totalDur/2);\n  const t0=when-into;               // context time where clip position 0 would be\n  g.gain.cancelScheduledValues(0);\n  if(f>0){\n    const setAt=(clipT,val)=>{const ct=t0+clipT;if(ct>=ctx.currentTime)g.gain.linearRampToValueAtTime(val,ct)};\n    const startVal=into<f?base*(into/f):(into>totalDur-f?base*((totalDur-into)/f):base);\n    g.gain.setValueAtTime(startVal,when);\n    if(into<f) setAt(f,base);\n    if(into<totalDur-f) g.gain.setValueAtTime(base,Math.max(when,t0+totalDur-f));\n    setAt(totalDur,0);\n  } else g.gain.setValueAtTime(base,when);\n  if(st.loop){src.loop=true;src.loopStart=st.trimS;src.loopEnd=st.trimE;\n    src.start(when,st.trimS+(into%len));src.stop(t0+totalDur);\n  } else src.start(when,st.trimS+into,len-into);\n  activeSrc=src;aGainNode=g;\n}\n\n// ---- playback\nasync function play(){\n  ensureCtx();\n  if(vid.ended||vid.currentTime>=vid.duration) vid.currentTime=0;\n  const pp=vid.play();ctx.resume();await pp;playing=true;restartAudioAt(vid.currentTime);\n  $('play').textContent='\u275a\u275a Pause';tick();\n}\nfunction pause(){vid.pause();stopAudio();playing=false;$('play').textContent='\u25b6 Play';cancelAnimationFrame(raf)}\nfunction stopAll(){if(vid.src){pause();vid.currentTime=0;updateTime()}}\n$('play').onclick=()=>playing?pause():play();\n$('stop').onclick=stopAll;\nvid.onended=()=>{if(!exporting)pause()};\nfunction updateTime(){\n  $('time').textContent=fmt(vid.currentTime)+' / '+fmt(vid.duration);\n  if(vid.duration) $('playhead').style.left=(vid.currentTime/vid.duration*100)+'%';\n}\nfunction tick(){updateTime();raf=requestAnimationFrame(tick)}\n\n// ---- export\nfunction pickMime(){\n  const c=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];\n  return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';\n}\n$('export').onclick=async()=>{\n  const canCap=!!(vid.captureStream||vid.mozCaptureStream), cv0=document.createElement('canvas');\n  if(!window.MediaRecorder||(!canCap&&!cv0.captureStream)){status('This browser cannot export. Update iOS / Safari, or use Chrome, Edge or Firefox.',true);return}\n  ensureCtx();await ctx.resume();pause();\n  exporting=true;$('export').disabled=true;$('play').disabled=$('stop').disabled=true;\n  $('dl').style.display='none';\n  let vstream,drawLoop=null;\n  if(canCap){vstream=(vid.captureStream||vid.mozCaptureStream).call(vid)}\n  else{ // iPhone/Safari: copy frames to a canvas and record that\n    const cv=cv0;cv.width=vid.videoWidth||1280;cv.height=vid.videoHeight||720;const g=cv.getContext('2d');\n    const draw=()=>{g.drawImage(vid,0,0,cv.width,cv.height);drawLoop=requestAnimationFrame(draw)};draw();\n    vstream=cv.captureStream(30);\n  }\n  const stream=new MediaStream([...vstream.getVideoTracks(),...mixDest.stream.getAudioTracks()]);\n  const mime=pickMime();\n  let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{})}catch(e){rec=new MediaRecorder(stream)}\n  const chunks=[];rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);\n  const prog=$('prog');prog.style.display='block';\n  rec.onstop=()=>{if(drawLoop)cancelAnimationFrame(drawLoop);\n    const type=rec.mimeType||'video/webm',ext=type.includes('mp4')?'mp4':'webm';\n    const url=URL.createObjectURL(new Blob(chunks,{type}));\n    const a=$('dl');a.href=url;a.download='edited-video.'+ext;a.style.display='block';a.textContent='\u2b07 Download edited-video.'+ext;\n    status('Export finished.');prog.style.display='none';\n    exporting=false;$('export').disabled=$('play').disabled=$('stop').disabled=false;\n    vid.currentTime=0;updateTime();\n  };\n  vid.currentTime=0;\n  await new Promise(r=>{const t=setTimeout(r,800);vid.onseeked=()=>{clearTimeout(t);vid.onseeked=null;r()}});\n  rec.start(500);\n  await vid.play();playing=true;restartAudioAt(0);tick();\n  status('Exporting\u2026 keep this tab open and visible.');\n  const iv=setInterval(()=>{prog.value=vid.currentTime/vid.duration*100},250);\n  vid.addEventListener('ended',function done(){\n    vid.removeEventListener('ended',done);clearInterval(iv);\n    stopAudio();playing=false;cancelAnimationFrame(raf);$('play').textContent='\u25b6 Play';\n    setTimeout(()=>rec.stop(),200);\n  });\n};\nsyncLabels();\n<\/script>\n<\/body>\n<\/html>\n", "stl-workbench.html": "<!doctype html>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<title>STL Workbench<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap\">\n<style>\n/* Layout: workbench \u2014 tool rail across the top, object rail left, 3D viewport center, inspector right; stacks on phones */\n:root{\n  --bg:#E8EBEF; --panel:#FBFCFD; --line:#D3D9E1; --fg:#18202B; --muted:#5A6576;\n  --accent:#2756D6; --accent-ink:#FFFFFF; --accent-soft:#E1E8FB;\n  --viewport:#DCE1E8; --bed:#F3F5F8; --grid-minor:#CAD1DB; --grid-major:#98A4B5;\n  --ax-x:#D6453D; --ax-y:#2F9445; --ax-z:#2F6FD6;\n  --warn:#A86A12; --bad:#C2372F; --ok:#257A4C;\n  --f-ui:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;\n  --f-label:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;\n  --f-num:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme: dark){:root:not([data-theme=\"light\"]){\n  --bg:#0F1319; --panel:#171C24; --line:#29313C; --fg:#E3E8EF; --muted:#8C97A8;\n  --accent:#7D9DFF; --accent-ink:#0C1220; --accent-soft:#1F2942;\n  --viewport:#12171E; --bed:#1A212B; --grid-minor:#28313D; --grid-major:#3E4B5C;\n  --ax-x:#FF6B61; --ax-y:#5CC46E; --ax-z:#5B95FF;\n  --warn:#E3A64B; --bad:#FF6B61; --ok:#4CC38A; color-scheme:dark;\n}}\n:root[data-theme=\"dark\"]{\n  --bg:#0F1319; --panel:#171C24; --line:#29313C; --fg:#E3E8EF; --muted:#8C97A8;\n  --accent:#7D9DFF; --accent-ink:#0C1220; --accent-soft:#1F2942;\n  --viewport:#12171E; --bed:#1A212B; --grid-minor:#28313D; --grid-major:#3E4B5C;\n  --ax-x:#FF6B61; --ax-y:#5CC46E; --ax-z:#5B95FF;\n  --warn:#E3A64B; --bad:#FF6B61; --ok:#4CC38A; color-scheme:dark;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{background:var(--bg);color:var(--fg);font:14px/1.4 var(--f-ui);margin:0}\nbutton,input,select{font:inherit;color:inherit}\n:focus-visible{outline:2px solid var(--accent);outline-offset:1px}\n\n.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;padding-inline:16px;padding-block:10px 16px}\n.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14p ar(--muted);font-variant-numeric:tabular-nums}\n.preset[aria-pressed=\"true\"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}\n.preset[aria-pressed=\"true\"] small{color:var(--panel);opacity:.8}\n.preset:focus-visible,.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}\n.jobs-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}\n.jobs-head .btn{white-space:nowrap;width:auto;padding:6px 10px;font-size:12.5px;margin:0}\n.job{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;display:grid;gap:8px;background:var(--field)}\n.job-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}\n.job-name{font-weight:600;min-width:0;overflow-wrap:anywhere;font-size:13.5px}\n.status{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}\n.status.done{color:var(--ink)} .status.fail{color:var(--err)}\n.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:2px 14px}\n.meta b{color:var(--ink);font-weight:600}\n.xbar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}\n.xbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}\n.xbar.indet>i{width:30%;animation:xslide 1.1s ease-in-out infinite}\n@keyframes xslide{from{transform:translateX(-100%)}to{transform:translateX(340%)}}\n@media (prefers-reduced-motion:reduce){.xbar.indet>i{animation:none;width:100%;opacity:.4}}\n.result{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.result audio{flex:1 1 200px;min-width:0;height:34px}\n.result .btn{width:auto;padding:7px 12px;font-size:13px;margin:0}\n.err{margin:0;font-size:12.5px;color:var(--err)}\n\nhtml{-webkit-text-size-adjust:100%;text-size-adjust:100%}\nbody{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}\nbutton,.btn,.preset,.drop,select,input,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}\n.drop{position:relative}\n.drop input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}\n@media (pointer:coarse){\n  .field input,.field select{font-size:16px}\n  .btn{min-height:44px}\n  .seg button,.preset{min-height:42px}\n  .jobs-head .btn{min-height:36px}\n  input[type=range]{height:32px}\n}\n<\/style>\n<\/head>\n<body>\n<header class=\"top\">\n  <svg width=\"44\" height=\"44\" viewBox=\"0 0 44 44\" aria-hidden=\"true\">\n    <circle cx=\"22\" cy=\"22\" r=\"21\" fill=\"var(--vinyl)\"/>\n    <circle cx=\"22\" cy=\"22\" r=\"17\" fill=\"none\" stroke=\"#ffffff22\"/>\n    <circle cx=\"22\" cy=\"22\" r=\"13.5\" fill=\"none\" stroke=\"#ffffff22\"/>\n    <circle cx=\"22\" cy=\"22\" r=\"8\" fill=\"var(--accent)\"/>\n    <circle cx=\"22\" cy=\"22\" r=\"1.6\" fill=\"var(--panel)\"/>\n  <\/svg>\n  <div>\n    <h1>Video Groove Cutter<\/h1>\n    <p>Pull the soundtrack out of a video as a lo-fi MP3, then cut it into a printable record. Exports a watertight binary STL in millimetres. Everything runs in this browser tab.<\/p>\n  <\/div>\n<\/header>\n\n<main class=\"layout\">\n  <section>\n    <div class=\"card\">\n      <h2><span class=\"num\">1<\/span>Video \u2192 Lo-Fi MP3<\/h2>\n      <label class=\"drop\" id=\"drop\">\n        <input type=\"file\" id=\"file\" accept=\"video/*,audio/*,.mkv,.mov,.m4v,.webm\" multiple aria-label=\"Choose video files\">\n        <strong>Choose a video file<\/strong>\n        <span id=\"dropHint\">or drop it here \u2014 MP4, MOV, WebM, MKV and most audio files<\/span>\n      <\/label>\n      <div class=\"field\" style=\"margin-top:12px\"><span id=\"presetLabel\">MP3 quality<\/span><\/div>\n      <div class=\"presets\" role=\"group\" aria-labelledby=\"presetLabel\">\n        <button class=\"preset\" id=\"p-voice\" data-preset=\"voice\" aria-pressed=\"false\">Voice <small>16 kHz \u00b7 24 kbps<\/small><\/button>\n        <button class=\"preset\" id=\"p-low\" data-preset=\"low\" aria-pressed=\"true\">Low <small>22 kHz \u00b7 32 kbps<\/small><\/button>\n        <button class=\"preset\" id=\"p-balanced\" data-preset=\"balanced\" aria-pressed=\"false\">Balanced <small>22 kHz \u00b7 48 kbps<\/small><\/button>\n        <button class=\"preset\" id=\"p-tiny\" data-preset=\"tiny\" aria-pressed=\"false\">Smallest <small>8 kHz \u00b7 16 kbps<\/small><\/button>\n      <\/div>\n      <div class=\"row3\">\n        <label class=\"field\"><span>Sample rate<\/span>\n          <select id=\"xrate\">\n            <option value=\"8000\">8,000 Hz<\/option>\n            <option value=\"11025\">11,025 Hz<\/option>\n            <option value=\"16000\">16,000 Hz<\/option>\n            <option value=\"22050\" selected>22,050 Hz<\/option>\n            <option value=\"32000\">32,000 Hz<\/option>\n            <option value=\"44100\">44,100 Hz<\/option>\n          <\/select><\/label>\n        <label class=\"field\"><span>Bitrate<\/span><select id=\"xkbps\"><\/select><\/label>\n        <label class=\"field\"><span>Channels<\/span>\n          <select id=\"xch\"><option value=\"1\" selected>Mono<\/option><option value=\"2\">Stereo<\/option><\/select><\/label>\n      <\/div>\n      <p class=\"hint\" id=\"xestimate\" style=\"margin:0\"><\/p>\n      <section id=\"jobsSection\" hidden>\n        <div class=\"jobs-head\">\n          <span class=\"small muted\">Extracted MP3s \u2014 the newest one feeds the record<\/span>\n          <span style=\"display:flex;gap:6px\">\n            <button class=\"btn\" id=\"redo\" type=\"button\" title=\"Run the last video again with the current MP3 settings\">Re-extract<\/button>\n            <button class=\"btn\" id=\"clear\" type=\"button\">Clear finished<\/button>\n          <\/span>\n        <\/div>\n        <div id=\"jobs\"><\/div>\n      <\/section>\n      <p class=\"hint\" style=\"margin:10px 0 0\">Settings apply to files added after you change them \u2014 use Re-extract to rerun the last video. Very long videos (several hours) may run out of memory on smaller machines. Works best in Chrome or Edge.<\/p>\n      <p class=\"hint\" id=\"iosNote\" style=\"margin:8px 0 0\" hidden><b>On iPhone:<\/b> pick a video from Photos or Files. Camera videos (MOV/MP4) work best; WebM and MKV usually won't. Only the sound track is read, so long 4K clips are fine. Keep Safari open with the screen on until the STL is saved.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <h2><span class=\"num\">2<\/span>Audio clip<\/h2>\n      <div id=\"fileInfo\" class=\"small muted\" style=\"margin-top:8px\"><\/div>\n      <canvas id=\"wave\" class=\"wave\" title=\"Click to set the start point\"><\/canvas>\n      <div class=\"row2\">\n        <label class=\"field\"><span>Start (s)<\/span><input id=\"start\" type=\"number\" inputmode=\"decimal\" min=\"0\" step=\"0.1\" value=\"0\"><\/label>\n        <label class=\"field\"><span>Length (s)<\/span><input id=\"dur\" type=\"number\" inputmode=\"decimal\" min=\"1\" step=\"1\" value=\"60\"><\/label>\n      <\/div>\n      <label class=\"field\"><span>Loudness / compression <output id=\"driveOut\"><\/output><\/span>\n        <input id=\"drive\" type=\"range\" min=\"0\" max=\"4\" step=\"0.1\" value=\"1.5\"><\/label>\n      <button id=\"play\" class=\"btn\" disabled>\u25b6 Preview at groove resolution<\/button>\n      <audio id=\"player\" controls preload=\"auto\" style=\"width:100%;margin-top:10px;display:block\" hidden><\/audio>\n    <\/div>\n\n    <div class=\"card\">\n      <h2><span class=\"num\">3<\/span>Record<\/h2>\n      <div class=\"seg\" id=\"sizeSeg\">\n        <button data-size=\"7\">7\u2033<\/button><button data-size=\"10\">10\u2033<\/button><button data-size=\"12\">12\u2033<\/button>\n      <\/div>\n      <div class=\"row2\">\n        <label class=\"field\"><span>Diameter (mm)<\/span><input id=\"diam\" type=\"number\" inputmode=\"decimal\" step=\"1\" value=\"175\"><\/label>\n        <label class=\"field\"><span>Speed<\/span>\n          <select id=\"rpm\"><option value=\"33\">33\u2153 RPM<\/option><option value=\"45\" selected>45 RPM<\/option><option value=\"78\">78 RPM<\/option><\/select><\/label>\n      <\/div>\n      <div class=\"row2\">\n        <label class=\"field\"><span>Thickness (mm)<\/span><input id=\"thick\" type=\"number\" inputmode=\"decimal\" step=\"0.1\" value=\"2.5\"><\/label>\n        <label class=\"field\"><span>Center hole \u2300 (mm)<\/span><input id=\"hole\" type=\"number\" inputmode=\"decimal\" step=\"0.01\" value=\"7.24\"><\/label>\n      <\/div>\n      <div class=\"row2\">\n        <label class=\"field\"><span>Label area \u2300 (mm)<\/span><input id=\"label\" type=\"number\" inputmode=\"decimal\" step=\"1\" value=\"80\"><\/label>\n        <label class=\"field\"><span>Edge margin (mm)<\/span><input id=\"margin\" type=\"number\" inputmode=\"decimal\" step=\"0.5\" value=\"4\"><\/label>\n      <\/div>\n    <\/div>\n\n    <div class=\"card\">\n      <h2><span class=\"num\">4<\/span>Groove<\/h2>\n      <div class=\"seg\" id=\"profSeg\">\n        <button data-prof=\"resin\">Resin printer<\/button><button data-prof=\"fdm\">FDM (Bambu A1 / mini)<\/button>\n      <\/div>\n      <label class=\"field\"><span>Modulation<\/span>\n        <select id=\"mode\">\n          <option value=\"both\" selected>Side-to-side + depth \u2014 real turntables and STL players<\/option>\n          <option value=\"lateral\">Side-to-side only \u2014 standard mono record<\/option>\n          <option value=\"vertical\">Depth only (hill-and-dale)<\/option>\n        <\/select><\/label>\n      <label class=\"field\"><span>Groove sample rate<\/span>\n        <select id=\"rate\">\n          <option value=\"4000\">4,000 Hz \u2014 smallest file<\/option>\n          <option value=\"6000\">6,000 Hz<\/option>\n          <option value=\"8000\" selected>8,000 Hz \u2014 recommended<\/option>\n          <option value=\"11025\">11,025 Hz<\/option>\n          <option value=\"16000\">16,000 Hz<\/option>\n          <option value=\"22050\">22,050 Hz \u2014 very large file<\/option>\n        <\/select><\/label>\n      <div class=\"row2\">\n        <label class=\"field\"><span>Groove pitch (mm)<\/span><input id=\"pitch\" type=\"number\" inputmode=\"decimal\" step=\"0.01\" value=\"0.6\"><\/label>\n        <label class=\"field\"><span>Top width (mm)<\/span><input id=\"gtop\" type=\"number\" inputmode=\"decimal\" step=\"0.01\" value=\"0.4\"><\/label>\n      <\/div>\n      <div class=\"row2\">\n        <label class=\"field\"><span>Bottom width (mm)<\/span><input id=\"gbot\" type=\"number\" inputmode=\"decimal\" step=\"0.01\" value=\"0\"><\/label>\n        <label class=\"field\"><span>Depth (mm)<\/span><input id=\"depth\" type=\"number\" inputmode=\"decimal\" step=\"0.01\" value=\"0.2\"><\/label>\n      <\/div>\n      <label class=\"field\"><span>Modulation amplitude (\u00b1 mm)<\/span><input id=\"amp\" type=\"number\" inputmode=\"decimal\" step=\"0.005\" value=\"0.08\"><\/label>\n      <p class=\"hint\">Bottom width 0 gives a V-groove (smaller file). Pitch is the spacing from one turn to the next.<\/p>\n    <\/div>\n\n    <div class=\"card\">\n      <button id=\"gen\" class=\"btn primary\">Generate STL<\/button>\n      <div class=\"progress\"><div id=\"bar\"><\/div><\/div>\n      <div id=\"genMsg\" class=\"small muted\">Load a video file to begin.<\/div>\n      <a id=\"dl\" class=\"btn\" hidden style=\"margin-top:10px\">Download STL<\/a>\n      <button id=\"share\" class=\"btn\" type=\"button\" hidden>Share / Save to Files<\/button>\n    <\/div>\n  <\/section>\n\n  <section>\n    <div class=\"card\">\n      <canvas id=\"rec\" class=\"rec\"><\/canvas>\n      <div id=\"stats\" class=\"stats\"><\/div>\n      <div id=\"msgs\"><\/div>\n    <\/div>\n    <div class=\"card\">\n      <h3>Groove close-up<\/h3>\n      <label class=\"field\"><span>Position in track <output id=\"cposOut\"><\/output><\/span>\n        <input id=\"cpos\" type=\"range\" min=\"0\" max=\"1000\" value=\"350\"><\/label>\n      <canvas id=\"close\"><\/canvas>\n      <p id=\"closeCap\" class=\"cap\"><\/p>\n    <\/div>\n    <div class=\"card\">\n      <h3>Groove cross-section<\/h3>\n      <canvas id=\"xsec\"><\/canvas>\n    <\/div>\n    <div class=\"card notes\">\n      <h3>Printing and playing<\/h3>\n      <ul>\n        <li><b>Resin (SLA/MSLA) gives the best sound.<\/b> The Resin profile's fine groove is too small for any FDM nozzle \u2014 the slicer fills it in.<\/li>\n        <li><b>FDM (Bambu A1 / A1 mini):<\/b> click the FDM profile. In Bambu Studio use a 0.2 mm nozzle if you have one, 0.08 mm layer height, Arc fitting off, outer wall speed about 30 mm/s, and a concentric top surface. Check the slicer preview: you should see a spiral gap with wavy walls. A bead can't draw a wiggle shorter than about twice the nozzle width, so keep the \u201c1 kHz wiggle length\u201d stat well above that.<\/li>\n        <li><b>Print flat, grooves up,<\/b> with no supports on the top face. The record must sit flat on the platter.<\/li>\n        <li><b>Side-to-side + depth<\/b> (the default) puts the sound in both directions at once. A real turntable's stylus reads the side-to-side wiggle; STL record players read the groove depth. On a stereo cartridge one channel comes out louder than the other \u2014 that's expected.<\/li>\n        <li>Most turntables, and most STL players, only offer <b>33\u2153 and 45 RPM<\/b>. Set the player to the same speed you chose here, or the pitch will be wrong.<\/li>\n        <li><b>The groove is cut from the extracted MP3<\/b>, not the video directly. The groove sample rate can't recover detail the MP3 step threw away \u2014 with the Smallest (8 kHz) preset, nothing above about 4 kHz survives, so a groove rate above 8,000 Hz only makes the STL bigger.<\/li>\n        <li><b>Expect lo-fi sound.<\/b> Speech and loud, simple music read best; the compression slider helps quiet tracks.<\/li>\n        <li>Set the turntable to the speed you chose. Playba globalAlpha=1;\n}\nfunction drawRecord(p,d,v){\n  const {ctx,w,h}=fit($('rec'));\n  const cx=w/2, cy=h/2, R=d.Rrec>0?d.Rrec:1, sc=(Math.min(w,h)/2-14)/R;\n  const P=(r,a)=>[cx+r*sc*Math.cos(a), cy-r*sc*Math.sin(a)];\n  ctx.save(); ctx.shadowColor='rgba(0,0,0,.28)'; ctx.shadowBlur=20; ctx.shadowOffsetY=8;\n  ctx.fillStyle=css('--vinyl'); ctx.beginPath(); ctx.arc(cx,cy,R*sc,0,Math.PI*2); ctx.fill(); ctx.restore();\n  if(!v.errs.length){\n    const N=d.N, lead=p.leadIn*N, A=state.audio;\n    const alen=A?A.length:Math.max(1,Math.round(Math.min(d.capSec,p.dur>0?p.dur:d.capSec)*d.rate));\n    const L=lead+alen+p.leadOut*N;\n    const rOut=d.R0, rIn=d.R0-p.pitch*((L-1)/N+1);\n    ctx.fillStyle='rgba(255,255,255,0.035)'; ctx.beginPath(); ctx.arc(cx,cy,rOut*sc,0,Math.PI*2); ctx.arc(cx,cy,rIn*sc,0,Math.PI*2,true); ctx.fill();\n    const segPerTurn=180, segLen=N/segPerTurn, nseg=Math.floor((L-1)/segLen), NB=6;\n    const paths=Array.from({length:NB},()=>new Path2D());\n    for(let q=0;q<nseg;q++){\n      const a=q*segLen, b=(q+1)*segLen;\n      let lvl=1;\n      if(A){ const i0=Math.max(0,Math.floor(a-lead)), i1=Math.min(alen,Math.ceil(b-lead)); let pk=0; for(let i=i0;i<i1;i++){ const x=Math.abs(A[i]); if(x>pk) pk=x; } lvl=i1>i0?Math.min(NB-1,Math.floor(pk*NB)):0; }\n      const r0=d.R0-p.pitch*0.5-p.pitch*a/N, r1=d.R0-p.pitch*0.5-p.pitch*b/N;\n      const [x0,y0]=P(r0,2*Math.PI*a/N), [x1,y1]=P(r1,2*Math.PI*b/N);\n      paths[lvl].moveTo(x0,y0); paths[lvl].lineTo(x1,y1);\n    }\n    ctx.lineWidth=Math.max(0.35,Math.min(1.2,p.pitch*sc*0.7)); ctx.lineCap='round';\n    for(let k=0;k<NB;k++){ ctx.strokeStyle=`rgba(236,229,218,${0.10+k*0.13})`; ctx.stroke(paths[k]); }\n  }\n  const g=ctx.createLinearGradient(cx-R*sc,cy-R*sc,cx+R*sc,cy+R*sc);\n  g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(0.45,'rgba(255,255,255,0.07)'); g.addColorStop(0.55,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(255,255,255,0.04)');\n  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R*sc,0,Math.P pSec,p.dur>0?p.dur:d.capSec)*d.rate));\n  const M=alen+(p.leadIn+p.leadOut)*N-1, tris=stlTriangleCount(M,N,p.gBot), bytes=84+50*tris;\n  add('Groove capacity',fmtTime(d.capSec));\n  add(state.audio?'Audio on record':'Audio (planned)',fmtTime(alen/d.rate));\n  add('Groove sample rate',Math.round(d.rate).toLocaleString()+' Hz');\n  add('Points per turn',N.toLocaleString());\n  add('Turns',fmt((M+1)/N,1));\n  const rIn=d.R0-p.pitch*(M/N+1);\n  add('Groove ends at','\u2300 '+fmt(2*rIn,1)+' mm');\n  add('1 kHz wiggle length (inner)',fmt(2*Math.PI*rIn*p.rpm/60/1000,2)+' mm');\n  add('Triangles',tris.toLocaleString());\n  add('STL size',fmtMB(bytes));\n  if(state.truncated) msg('warn',`Only ${fmtTime(state.usedSec)} of the ${fmtTime(state.reqSec)} selected fits. Use a bigger record, a smaller label, a finer pitch or a slower speed \u2014 or pick a shorter section.`);\n  if(bytes>STL_MAX) msg('err',`This STL would be over ${fmtMB(STL_MAX)}, too large to build ${IS_IOS?'on an iPhone':'in the browser'}. Lower the sample rate or shorten the clip.`);\n  else if(bytes>STL_WARN) msg('warn',IS_IOS?`The STL will be about ${fmtMB(bytes)}. That's a lot for an iPhone \u2014 if Safari reloads the page, lower the groove sample rate or shorten the clip.`:`The STL will be about ${fmtMB(bytes)}. Many slicers struggle above a few hundred MB \u2014 consider a lower sample rate or shorter clip.`);\n  if(!state.src) msg('ok','Load a video file to fill the groove. Capacity above reflects current record settings.');\n}\n\nfunction redraw(){\n  const p=readParams(), d=derive(p), v=validate(p,d);\n  $('driveOut').textContent=p.drive<0.05?'off':fmt(p.drive,1);\n  [...$('sizeSeg').children].forEach(b=>{ const pr=PRESETS[b.dataset.size]; b.classList.toggle('on',pr&&Math.abs(pr.diam-p.D)<0.01); });\n  [...$('profSeg').children].forEach(b=>{ const pr=PROFILES[b.dataset.prof]; b.classList.toggle('on',Math.abs(pr.pitch-p.pitch)<1e-6&&Math.abs(pr.gtop-p.gTop)<1e-6&&Math.abs(pr.depth-p.depth)<1e-6); });\n 00&display=swap\">\n<style>\n/* Layout: one narrow work column \u2014 settings strip, drop zone, then a job list that grows as files are added. */\n:root {\n  --bg: #eef1f4;\n  --surface: #ffffff;\n  --ink: #18202a;\n  --muted: #5b6673;\n  --line: #d5dbe2;\n  --accent: #c2570c;\n  --accent-ink: #ffffff;\n  --accent-soft: #fbe9dc;\n  --ok: #1f7a4d;\n  --err: #b3261e;\n  --display: \"Bricolage Grotesque\", \"Segoe UI\", system-ui, sans-serif;\n  --body: \"IBM Plex Sans\", \"Segoe UI\", system-ui, -apple-system, sans-serif;\n  --mono: \"IBM Plex Mono\", ui-monospace, \"SFMono-Regular\", Consolas, monospace;\n  color-scheme: light;\n}\n@media (prefers-color-scheme: dark) {\n  :root:not([data-theme=\"light\"]) {\n    --bg: #12171d; --surface: #1a2129; --ink: #e6ebf0; --muted: #94a0ad; --line: #2d3741;\n    --accent: #f08a3e; --accent-ink: #1a1007; --accent-soft: #3a2616; --ok: #5cc68e; --err: #f2847b;\n    color-scheme: dark;\n  }\n}\n:root[data-theme=\"dark\"] {\n  --bg: #12171d; --surface: #1a2129; --ink: #e6ebf0; --muted: #94a0ad; --line: #2d3741;\n  --accent: #f08a3e; --accent-ink: #1a1007; --accent-soft: #3a2616; --ok: #5cc68e; --err: #f2847b;\n  color-scheme: dark;\n}\n* { box-sizing: border-box; }\nhtml, body { margin: 0; }\nbody {\n  background: var(--bg); color: var(--ink);\n  font: 15px/1.55 var(--body);\n  padding-inline: 16px; padding-block: 40px 64px;\n}\n.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 24px; }\nheader { display: grid; gap: 6px; }\nh1 { font: 700 clamp(28px, 6vw, 40px)/1.05 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }\nh1 .tag { color: var(--accent); }\n.lede { margin: 0; color: var(--muted); max-width: 60ch; }\n.label { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: 0.09em; color: var(--muted); }\n\n.settings { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 16px; }\n.presets { display: flex; flex-wrap: wrap stener('durationchange',ready);v.addEventListener('canplay',ready);\n    v.onerror=()=>finish(null);\n    v.src=url;v.load();\n    try{const k=v.play();if(k&&k.catch)k.catch(()=>{})}catch(e){}\n    setTimeout(()=>{ready();setTimeout(()=>finish(null),3000)},15000);\n  });\n}\nasync function addFiles(list){\n  const files=[...list].filter(f=>!f.type||f.type.startsWith('video/')||/\\.(mp4|mov|m4v|webm|mkv|3gp)$/i.test(f.name));\n  if(!files.length) return;\n  stopRun();\n  for(const [k,f] of files.entries()){\n    status('Loading '+(k+1)+' of '+files.length+': '+f.name+'\u2026');\n    const p=await probe(f);\n    if(!p){status('Could not open '+f.name+'. If it is a long 4K/HDR clip, try a shorter one or export it at 1080p from Photos.',true);continue}\n    clips.push({id:nextId++,name:f.name.replace(/\\.[^.]+$/,''),url:p.url,dur:p.dur,w:p.w,h:p.h,thumb:p.thumb,in:0,out:p.dur,fin:0,fout:0,vol:1});\n    if(sel<0) sel=0;\n    if(clips.length===1) applyRes();\n    render();\n  }\n  status(clips.length+' clip'+(clips.length===1?'':'s')+' \u00b7 total '+fmt(total())+'. Select a clip to edit it.');\n  showStill();\n}\n$('drop').onclick=()=>$('files').click();\n$('files').onchange=e=>{addFiles(e.target.files);e.target.value=''};\n$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};\n$('drop').ondragleave=()=>$('drop').classList.remove('over');\n$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');addFiles(e.dataTransfer.files)};\n\n// ---------- output size\nfunction applyRes(){\n  const r=$('res').value, c=clips[0];\n  let w=1280,h=720;\n  const ar=c&&c.w&&c.h?c.w/c.h:16/9;\n  if(r==='src'&&c&&c.w){w=c.w;h=c.h;const m=Math.max(w,h);if(m>1920){w=Math.round(w*1920/m);h=Math.round(h*1920/m)}}\n  else{h=+r||720;w=Math.round(h*ar)}\n  stage.width=w&~1;stage.height=h&~1;\n  stage.parentElement.style.aspectRatio=stage.width+'/'+stage.height;\n  showStill();\n}\n$('res').onchange=applyRes;\n\n// ---------- rendering UI\nfunction render() .min(playhead,total());\n  render();if(!running) showStill();\n}\nfunction onSlider(){\n  const c=clips[sel];if(!c||exporting)return;\n  let a=+$('in').value,b=+$('out').value;\n  if(this===$('in')&&a>b-0.1)a=Math.max(0,b-0.1);\n  if(this===$('out')&&b<a+0.1)b=Math.min(c.dur,a+0.1);\n  c.in=a;c.out=b;\n  c.fin=+$('fin').value;c.fout=+$('fout').value;c.vol=$('vol').value/100;\n  const L=len(c);if(c.fin+c.fout>L){const k=L/(c.fin+c.fout);c.fin*=k;c.fout*=k}\n  if(this===$('in')||this===$('out')){stopRun();playhead=startOf(sel)+(this===$('out')?Math.max(0,len(c)-0.05):0)}\n  edited(true);\n}\n['in','out','fin','fout','vol'].forEach(id=>$(id).addEventListener('input',onSlider));\nfunction playheadInSel(){const c=clips[sel];if(!c)return null;const s=startOf(sel),t=playhead-s;if(t<0||t>len(c))return null;return c.in+t}\n$('setIn').onclick=()=>{const t=playheadInSel(),c=clips[sel];if(t==null){status('Move the playhead inside the selected clip first.',true);return}\n  if(c.out-t<0.1)return;stopRun();c.in=t;playhead=startOf(sel);edited(true)};\n$('setOut').onclick=()=>{const t=playheadInSel(),c=clips[sel];if(t==null){status('Move the playhead inside the selected clip first.',true);return}\n  if(t-c.in<0.1)return;stopRun();c.out=t;edited()};\n$('split').onclick=()=>{\n  const t=playheadInSel(),c=clips[sel];\n  if(t==null||t-c.in<0.1||c.out-t<0.1){status('Move the playhead inside the selected clip (not at its edge) to cut it.',true);return}\n  stopRun();\n  const b={...c,id:nextId++,in:t,fin:0};c.out=t;c.fout=0;\n  clips.splice(sel+1,0,b);sel++;status('Clip cut in two. Delete a piece to remove that section.');edited(true);\n};\nfunction move(d){stopRun();const j=sel+d;if(j<0||j>=clips.length)return;[clips[sel],clips[j]]=[clips[j],clips[sel]];sel=j;playhead=startOf(sel);edited(true)}\n$('left').onclick=()=>move(-1);$('right').onclick=()=>move(1);\n$('dup').onclick=()=>{stopRun();clips.splice(sel+1,0,{...clips[sel],id:nextId++});sel++;edited()};\n$('del').onclick=()=>{stopRun();clips.splice(sel,1);if(sel>=clips.length)sel=clips.length-1;playhead=sel>=0?startOf(sel):0;edited(true);if(!clips.length){g.fillStyle='#000';g.fillRect(0,0,stage.width,stage.height)}};\n\n// ---------- timeline seek\nfunction seekFromEvent(e){\n  if(exporting||!clips.length)return;\n  const r=$('timeline').getBoundingClientRect(),T=total();\n  playhead=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*T;\n  const at=locate(playhead);sel=at.i;\n  const wasRunning=running;stopRun();render();\n  if(wasRunning) startRun(false);else showStill();\n}\n$('timeline').onpointerdown=seekFromEvent;\n\n// ---------- engine\nfunction locate(t){let s=0;for(let i=0;i<clips.length;i++){const L=len(clips[i]);if(t<s+L||i===clips.length-1)return{i,off:Math.max(0,Math.min(L,t-s))};s+=L}return{i:0,off:0}}\nfunction alphaFor(c,local){\n  const L=len(c);let a=1;\n  if(c.fin>0) a=Math.min(a,local/c.fin);\n  if(c.fout>0) a=Math.min(a,(L-local)/c.fout);\n  return Math.max(0,Math.min(1,a));\n}\nfunction draw(el,alpha){\n  const vw=el.videoWidth,vh=el.videoHeight;\n  if(!vw||!vh||el.readyState<2) return;          // not ready: keep the last frame on screen (no black flash)\n  const W=stage.width,H=stage.height;\n  g.globalAlpha=1;g.fillStyle='#000';g.fillRect(0,0,W,H);\n  if(alpha<=0) return;\n  const s=Math.min(W/vw,H/vh),dw=vw*s,dh=vh*s;\n  g.globalAlpha=alpha;g.drawImage(el,(W-dw)/2,(H-dh)/2,dw,dh);g.globalAlpha=1;\n}\nasync function load(el,c){\n  if(el.dataset.url!==c.url){el.dataset.url=c.url;el.src=c.url;el.load()}\n  if(el.readyState<2){el.muted=true;try{const k=el.play();if(k&&k.catch)k.catch(()=>{})}catch(e){}await waitEv(el,'loadeddata',6000);el.pause();el.muted=false}\n}\nasync function seekTo(el,t){\n  if(Math.abs(el.currentTime-t)<0.01&&el.readyState>=2)return;\n  el.currentTime=t;await waitEv(el,'seeked',3000);\n}\nasync function showStill(){\n  if(running||!clips.length)return;\n  const tok=++runToken,{i,off}=locate(playhead),c=clips[i],el=players[cur];\n  await load(el,c);if(tok!==runToken)return;\n  await seekTo(el,c.in+Math.min(off,len(c)-0.03));if(tok!==runToken)return;\n  draw(el,alphaFor(c,off)||0.15);\n}\nfunction setGain(k,v){const gn=gains[k];if(!gn)return;try{gn.gain.setTargetAtTime(v,ctx.currentTime,0.012)}catch(e){gn.gain.value=v}}\nfunction stopRun(){if(running){runToken++;running=false;players.forEach((el,k)=>{el.pause();setGain(k,0)});$('play').textContent='\u25b6 Play'}}\nconst keyOf=(c,t)=>c.id+'@'+t.toFixed(2);\n\nasync function startRun(record,rec){\n  ensureAudio();await ctx.resume();\n  const tok=++runToken;running=true;$('play').textContent='\u275a\u275a Pause';\n  let {i,off}=record?{i:0,off:0}:locate(playhead);\n  if(!record&&playhead>=total()-0.05){i=0;off=0;playhead=0}\n  let prep=null;\n  for(;i<clips.length;i++,off=0){\n    const c=clips[i],base=startOf(i),t0=c.in+off;sel=i;if(!record)render();\n    let k;\n    if(prep&&prep.key===keyOf(c,t0)){k=prep.k;await prep.p}\n    else{\n      if(prep){await prep.p.catch(()=>{})}\n      k=cur;\n      if(rec&&rec.state==='recording'&&rec.pause)try{rec.pause()}catch(e){}\n      await load(players[k],c);if(tok!==runToken)return false;\n      await seekTo(players[k],t0);\n    }\n    if(tok!==runToken)return false;\n    const el=players[k];cur=k;\n    draw(el,alphaFor(c,off));\n    setGain(k,c.vol*alphaFor(c,off));\n    try{await el.play()}catch(e){status('Playback was blocked \u2014 tap Play again.',true);stopRun();return false}\n    if(rec){if(rec.state==='inactive')rec.start(500);else if(rec.state==='paused')rec.resume()}\n    // get the next clip loaded and parked at its start in the other player\n    prep=null;\n    if(i+1<clips.length){\n      const n=clips[i+1],kk=1-k,o=players[kk];\n      prep={k:kk,key:keyOf(n,n.in),p:(async()=>{o.pause();setGain(kk,0);await load(o,n);await seekTo(o,n.in)})()};\n    }\n    let lastT=-1,stall=0;\n    while(tok===runToken){\n      const local=el.currentTime-c.in,a=alphaFor(c,local);\n      draw(el,a);setGain(k,c.vol*a);\n      playhead=base+Math.max(0,Math.min(len(c),local));updateTime();\n      if(record){$('prog').value=playhead/total()*100}\n      if(el.ended||el.currentTime>=c.out-0.02)break;\n      if(el.currentTime===lastT){if(++stall>600)break}else{stall=0;lastT=el.currentTime}\n      await frame();\n    }\n    el.pause();setGain(k,0);\n    if(tok!==runToken)return false;\n  }\n  running=false;$('play').textContent='\u25b6 Play';\n  if(!record){playhead=total();render()}\n  return true;\n}\n\nfunction unlock(){\n  ensureAudio();try{ctx.resume()}catch(e){}\n  players.forEach(el=>{\n    if(!el.getAttribute('src')&&clips[0]){el.dataset.url=clips[0].url;el.src=clips[0].url}\n    try{const p=el.play();if(p&&p.then)p.then(()=>{if(!running||el!==players[cur])el.pause()},()=>{})}catch(e){}\n  });\n}\n$('play').onclick=()=>{if(exporting)return;if(running)stopRun();else{unlock();startRun(false)}};\n$('stop').onclick=()=>{if(exporting)return;stopRun();playhead=0;sel=clips.length?0:-1;render();showStill()};\n\n// ---------- export\nfunction pickMime(){\n  const list=['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];\n  return list.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))||'';\n}\n$('export').onclick=async()=>{\n  if(!clips.length)return;\n  if(!window.MediaRecorder||!stage.captureStream){status('This browser cannot export video. Update iOS/Safari, or use Chrome, Edge or Firefox.',true);return}\n  unlock();await ctx.resume();stopRun();\n  exporting=true;render();$('dl').style.display='none';\n  const vs=stage.captureStream(30);\n  const tracks=[...vs.getVideoTracks()];if(dest)tracks.push(...dest.stream.getAudioTracks());\n  const stream=new MediaStream(tracks),mime=pickMime();\n  let rec;try{rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:8e6}:{})}catch(e){rec=new MediaRecorder(stream)}\n  const chunks=[];rec.ondataavailable=e=>e.data&&e.data.size&&chunks.push(e.data);\n  const done=new Promise(r=>rec.onstop=r);\n  $('prog').style.display='block';$('prog').value=0;\n  status('Exporting\u2026 keep this screen on and visible.');\n  const ok=await startRun(true,rec);\n  if(rec.state!=='inactive'){if(rec.state==='paused')try{rec.resume()}catch(e){}await new Promise(r=>setTimeout(r,250));rec.stop()}\n  await done;\n  vs.getTracks().forEach(t=>t.stop());\n  exporting=false;$('prog').style.display='none';\n  if(!ok||!chunks.length){status('Export was interrupted.',true);render();return}\n  const type=rec.mimeType||mime||'video/webm',ext=/mp4/.test(type)?'mp4':'webm';\n  const a=$('dl');a.href=URL.createObjectURL(new Blob(chunks,{type:type.split(';')[0]}));\n  a.download='joined-video.'+ext;a.textContent='\u2b07 Download joined-video.'+ext;a.style.display='block';\n  status('Export finished \u2014 '+fmt(total())+'.');\n  playhead=0;render();showStill();\n};\nrender();\n<\/script>\n<\/body>\n<\/html>\n"};
// ---- Add new tools here: one line each ----
const TOOLS = [
  { file: "index.html",                 icon: "🎬", name: "Video Audio Mixer",   desc: "Add, trim, fade and mix an audio track over a video, then export." },
  { file: "stl-workbench.html",         icon: "🧊", name: "STL Workbench",       desc: "Open, arrange, scale and export STL files on a build plate." },
  { file: "lofi-audio-extractor.html",  icon: "🎧", name: "Lo-Fi Audio Extractor", desc: "Pull the soundtrack out of a video as a small MP3." },
  { file: "audio-to-record-stl.html",   icon: "💿", name: "Video Groove Cutter", desc: "Turn a video's audio into a printable record STL." },
  { file: "video-to-mp3.html",          icon: "🎵", name: "Video to MP3",        desc: "Convert a video's soundtrack to a full-quality MP3 (up to 320 kbps)." },
  { file: "video-joiner.html",          icon: "🎞️", name: "Video Joiner",        desc: "Combine several videos into one, with trim, cut and fade in/out." },
];

const $ = id => document.getElementById(id);
$("grid").innerHTML = TOOLS.map((t, i) =>
  `<button class="tool" data-i="${i}" type="button"><div class="icon">${t.icon}</div><b>${t.name}</b><span>${t.desc}</span></button>`
).join("");
$("grid").addEventListener("click", e => {
  const b = e.target.closest(".tool"); if (b) openTool(+b.dataset.i);
});
function openTool(i){
  const t = TOOLS[i];
  const html = BUNDLE[t.file];
  if (html) {
    $("frame").srcdoc = html;
    try { $("popBtn").href = URL.createObjectURL(new Blob([html], {type: "text/html"})); $("popBtn").style.display = ""; }
    catch (e) { $("popBtn").style.display = "none"; }
  } else { $("frame").removeAttribute("srcdoc"); $("frame").src = t.file; $("popBtn").href = t.file; }
  $("title").textContent = t.icon + " " + t.name; $("subtitle").textContent = "Casey's Toolbox";
  document.body.classList.add("viewing");
  try { history.replaceState(null, "", "#" + encodeURIComponent(t.file)); } catch (e) {}
}
function goHome(){
  $("frame").removeAttribute("srcdoc"); $("frame").src = "about:blank";
  $("title").textContent = "🧰 Casey's Toolbox"; $("subtitle").textContent = "Pick a tool to get started";
  document.body.classList.remove("viewing");
  try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {}
}
$("backBtn").onclick = goHome;
const start = TOOLS.findIndex(t => "#" + encodeURIComponent(t.file) === location.hash);
if (start >= 0) openTool(start);
